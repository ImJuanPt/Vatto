<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4f46e5">
  <title>VATTO – Vincular medidor</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --success: #16a34a;
      --surface: #ffffff;
      --bg: #f1f5f9;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: 0 4px 32px rgba(0,0,0,.10);
      padding: 36px 28px;
      max-width: 420px;
      width: 100%;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .logo svg { width: 36px; height: 36px; flex-shrink: 0; }

    .logo-text {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--primary);
    }

    .logo-sub {
      font-size: 11px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: .4px;
      text-transform: uppercase;
      margin-top: -4px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .device-badge {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 24px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .device-badge .icon { font-size: 24px; flex-shrink: 0; margin-top: 2px; }

    .device-info { display: flex; flex-direction: column; gap: 4px; }

    .device-label { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: #3b82f6; font-weight: 600; }

    .device-mac {
      font-family: 'Courier New', monospace;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 1px;
    }

    .device-model { font-size: 12px; color: var(--muted); }

    .actions { display: flex; flex-direction: column; gap: 12px; }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 20px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: transform .15s, box-shadow .15s, opacity .15s;
      width: 100%;
    }

    .btn:active { transform: scale(.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      box-shadow: 0 4px 14px rgba(79,70,229,.35);
    }

    .btn-primary:hover { box-shadow: 0 6px 20px rgba(79,70,229,.45); }

    .btn-secondary {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover { background: var(--border); }

    .steps {
      margin-top: 28px;
      border-top: 1px solid var(--border);
      padding-top: 22px;
    }

    .steps-title {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--muted);
      margin-bottom: 14px;
    }

    .step {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      align-items: flex-start;
    }

    .step-num {
      background: var(--primary);
      color: white;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .step-text {
      font-size: 13px;
      color: var(--text);
      line-height: 1.5;
    }

    .no-mac {
      background: #fefce8;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 13px;
      color: #92400e;
      margin-bottom: 20px;
    }

    footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <!-- Lightning bolt icon -->
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="36" height="36" rx="9" fill="#4f46e5"/>
        <path d="M21 7L11 20h7l-3 9 11-13h-7l2-9z" fill="white"/>
      </svg>
      <div>
        <div class="logo-text">VATTO</div>
        <div class="logo-sub">Monitor de energía</div>
      </div>
    </div>

    <div id="main-content">
      <!-- Filled by JS -->
    </div>
  </div>

  <footer>VATTO &copy; 2026 &mdash; vatto.online</footer>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const mac = params.get('mac') || '';
      const model = params.get('model') || 'PZEM-ESP32-V1';
      const apiBase = 'https://vatto.online/api/v1';
      const apkBaseUrl = 'https://vatto.online/apk/vatto-latest.apk';
      const appUrl = 'https://vatto.online';

      const container = document.getElementById('main-content');

      async function registerDeferredLink() {
        if (!mac) return null;

        try {
          const response = await fetch(`${apiBase}/deferred-links/register`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ mac, model }),
          });

          if (!response.ok) return null;
          return await response.json();
        } catch {
          return null;
        }
      }

      function buildApkUrl(deferredId) {
        if (!deferredId) return apkBaseUrl;
        return `${apkBaseUrl}?dlid=${encodeURIComponent(deferredId)}`;
      }

      if (!mac) {
        container.innerHTML = `
          <div class="no-mac">
            ⚠️ Este QR no contiene información de un medidor. Escanea el QR que viene pegado físicamente en el medidor VATTO.
          </div>
          <h1>Descarga la app VATTO</h1>
          <p class="subtitle">Registra y monitorea tu consumo eléctrico en tiempo real.</p>
          <div class="actions">
            <a href="${apkBaseUrl}" class="btn btn-primary">
              ⬇️ Descargar app VATTO (Android)
            </a>
            <a href="${appUrl}" class="btn btn-secondary" target="_blank">
              🌐 Abrir portal web
            </a>
          </div>`;
        return;
      }

      (async function renderWithDeferred() {
        const deferred = await registerDeferredLink();
        const deferredId = deferred?.id || '';
        const deferredCode = deferred?.code || '';
        const isAndroid = /android/i.test(navigator.userAgent);
        const deepLink = `vatto://pair?mac=${encodeURIComponent(mac)}&model=${encodeURIComponent(model)}${deferredId ? `&dlid=${encodeURIComponent(deferredId)}` : ''}`;
        const apkUrl = buildApkUrl(deferredId);

        let openAppBtn = '';
        if (isAndroid) {
          openAppBtn = `<a href="${deepLink}" class="btn btn-primary" id="open-app-btn">
            📱 Abrir en app VATTO
          </a>`;
        }

        const fallbackCodeBlock = deferredCode
          ? `
          <div style="margin-top:12px;padding:12px;border:1px dashed #cbd5e1;border-radius:10px;background:#f8fafc">
            <div style="font-size:12px;color:#475569;font-weight:600;margin-bottom:4px">Código de recuperación diferida</div>
            <div style="font-family:'Courier New',monospace;font-size:20px;font-weight:800;letter-spacing:2px;color:#0f172a">${escapeHtml(deferredCode)}</div>
            <div style="font-size:12px;color:#64748b;margin-top:6px">Si instalas la app después, en onboarding usa este código para recuperar el medidor sin reescanear.</div>
          </div>`
          : '';

        container.innerHTML = `
          <h1>Vincular medidor</h1>
          <p class="subtitle">Escanea este QR desde la app VATTO para vincular el medidor a tu cuenta automáticamente.</p>

          <div class="device-badge">
            <div class="icon">⚡</div>
            <div class="device-info">
              <span class="device-label">Medidor detectado</span>
              <span class="device-mac">${escapeHtml(mac)}</span>
              <span class="device-model">${escapeHtml(model)}</span>
            </div>
          </div>

          ${fallbackCodeBlock}

          <div class="actions" style="margin-top:12px">
            ${openAppBtn}
            <a href="${apkUrl}" class="btn ${isAndroid ? 'btn-secondary' : 'btn-primary'}">
              ⬇️ Descargar app VATTO (Android)
            </a>
            <a href="${appUrl}" class="btn btn-secondary" target="_blank">
              🌐 Abrir portal web
            </a>
          </div>

          <div class="steps">
            <div class="steps-title">¿Cómo vincular?</div>
            <div class="step"><div class="step-num">1</div><div class="step-text">Descarga e instala la app VATTO en tu teléfono Android.</div></div>
            <div class="step"><div class="step-num">2</div><div class="step-text">Crea tu cuenta o inicia sesión.</div></div>
            <div class="step"><div class="step-num">3</div><div class="step-text">En <strong>Agregar medidor</strong>, la app intentará recuperar el medidor automáticamente.</div></div>
            <div class="step"><div class="step-num">4</div><div class="step-text">Si no lo detecta, escanea el QR o usa el código de recuperación mostrado arriba.</div></div>
          </div>`;

        if (isAndroid) {
          setTimeout(function () {
            const btn = document.getElementById('open-app-btn');
            if (btn) btn.click();
          }, 800);
        }
      })();

      function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function (c) {
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
      }
    })();
  </script>
</body>
</html>

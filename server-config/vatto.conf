# =====================================================================
#  VATTO – nginx configuration for vatto.online
#  Server: 217.71.203.129  Ubuntu  nginx/1.18.0
#
#  INSTRUCCIONES DE INSTALACIÓN (ejecutar en el servidor):
#  1. Asegúrate de que el DNS de vatto.online apunte a 217.71.203.129
#     (registro A: vatto.online → 217.71.203.129)
#     (registro A: www.vatto.online → 217.71.203.129)
#
#  2. Copia este archivo:
#       sudo cp vatto.conf /etc/nginx/sites-available/vatto.online
#       sudo ln -s /etc/nginx/sites-available/vatto.online /etc/nginx/sites-enabled/
#       sudo rm -f /etc/nginx/sites-enabled/default   # quitar default si existe
#
#  3. Crea los directorios estáticos:
#       sudo mkdir -p /var/www/vatto/qr
#       sudo mkdir -p /var/www/vatto/apk
#       sudo cp qr-landing/index.html /var/www/vatto/qr/index.html
#
#  4. Prueba la config sin SSL primero:
#       sudo nginx -t && sudo systemctl reload nginx
#
#  5. Instala certbot y obtén el certificado SSL:
#       sudo apt update && sudo apt install -y certbot python3-certbot-nginx
#       sudo certbot --nginx -d vatto.online -d www.vatto.online
#       (sigue las instrucciones: ingresa email, acepta términos)
#
#  6. Certbot modifica este archivo automáticamente con los paths SSL.
#     El bloque 443 de abajo es para referencia; certbot lo completará.
#
#  7. Verifica renovación automática:
#       sudo systemctl status certbot.timer
#       sudo certbot renew --dry-run
# =====================================================================

# ── Redirect HTTP → HTTPS ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name vatto.online www.vatto.online;

    # Certbot challenge (necesario para obtener/renovar certificado)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://vatto.online$request_uri;
    }
}

# ── Redirect www → non-www (HTTPS) ────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.vatto.online;

    # Certbot completará estas líneas automáticamente:
    # ssl_certificate /etc/letsencrypt/live/vatto.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vatto.online/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vatto.online$request_uri;
}

# ── Main HTTPS server ──────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vatto.online;

    # Certbot completará estas líneas automáticamente:
    # ssl_certificate /etc/letsencrypt/live/vatto.online/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/vatto.online/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # ── Seguridad ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Logs ───────────────────────────────────────────────────────
    access_log /var/log/nginx/vatto_access.log;
    error_log  /var/log/nginx/vatto_error.log;

    # ── Página QR (landing estática) ──────────────────────────────
    # Acceso: https://vatto.online/qr?mac=AA:BB:CC:DD:EE:FF&model=PZEM-ESP32-V1
    location = /qr {
        alias /var/www/vatto/qr/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        default_type text/html;
    }

    # ── Descarga APK ──────────────────────────────────────────────
    # Coloca el APK en: /var/www/vatto/apk/vatto-latest.apk
    location /apk/ {
        alias /var/www/vatto/apk/;
        add_header Content-Disposition "attachment";
        types {
            application/vnd.android.package-archive apk;
        }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-cache";
    }

    # ── API Backend (Express en puerto 3000) ───────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }

    # ── WebSocket (Socket.IO) ──────────────────────────────────────
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── Web App (React/Vite build) ─────────────────────────────────
    # Ajusta la ruta al directorio donde está el build de la web (my-app/dist)
    root /var/www/vatto/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Cache agresivo para assets estáticos con hash en el nombre
    location ~* \.(js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}
